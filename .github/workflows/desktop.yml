name: Build desktop previews

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag for the GitHub release
        required: true
        default: desktop-v10.6.1-preview.1
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS · Apple silicon
            os: macos-15
            platform: macos
          - id: macos-x64
            label: macOS · Intel
            os: macos-15-intel
            platform: macos
          - id: windows-x64
            label: Windows · x64
            os: windows-latest
            platform: windows
          - id: linux-x64
            label: Linux · x64
            os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev pulseaudio xvfb dbus-x11
      - run: flutter pub get

      - name: Build and package macOS app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.id == 'macos-arm64' && 'arm64' || 'x86_64' }}
        run: |
          flutter build macos --config-only
          DERIVED_DATA="build/macos/DerivedData"
          xcodebuild -project macos/Runner.xcodeproj -scheme Runner -configuration Release -derivedDataPath "$DERIVED_DATA" -arch "$MAC_ARCH" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          APP="$DERIVED_DATA/Build/Products/Release/Forge.app"
          test -d "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          python .github/scripts/check_desktop_startup.py "$APP/Contents/MacOS/$EXECUTABLE"
          mkdir -p dist/dmg
          ditto "$APP" dist/dmg/Forge.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Forge -srcfolder dist/dmg -ov -format UDZO "dist/Forge-v$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)-macos-${{ matrix.id == 'macos-arm64' && 'arm64' || 'x64' }}.dmg"

      - name: Build and package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          python .github/scripts/check_desktop_startup.py build/windows/x64/runner/Release/forge.exe
          python .github/scripts/check_windows_icons.py build/windows/x64/runner/Release/forge.exe
          $env:FORGE_VERSION = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)' | ForEach-Object { $_.Matches.Groups[1].Value })
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not installed on the runner' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$env:FORGE_VERSION" /ODist packaging/windows/forge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package Linux bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=forge-test
          export MUSIFY_TEST_LIBMPV=/usr/lib/x86_64-linux-gnu/libmpv.so.2
          flutter test test/desktop/audio_native_test.dart test/desktop/media_handler_native_test.dart
          dbus-run-session -- xvfb-run -a python .github/scripts/check_desktop_startup.py build/linux/x64/release/bundle/forge
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist/Forge
          cp -R build/linux/x64/release/bundle/. dist/Forge/
          cp README.md LICENSE dist/Forge/
          tar -czf "dist/Forge-v${VERSION}-linux-x64.tar.gz" -C dist Forge

      - name: Verify Windows audio playback tests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S test/windows/runtime -B build/windows-runtime-test -A x64
          cmake --build build/windows-runtime-test --config Release
          ctest --test-dir build/windows-runtime-test -C Release --output-on-failure
          $env:MUSIFY_TEST_LIBMPV = "$(Get-Location)\build\windows\x64\runner\Release\libmpv-2.dll"
          flutter test test/desktop/audio_native_test.dart test/desktop/media_handler_native_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.id }}
          path: dist/Forge-v*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish verified preview installers
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate preview tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Use a tag like desktop-v10.6.1-preview.1" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          path: dist
          merge-multiple: true
      - name: Create release checksums
        run: |
          cd dist
          sha256sum Forge-v* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$REPOSITORY" \
            --target "$COMMIT_SHA" \
            --prerelease \
            --title "Forge ${RELEASE_TAG#desktop-} · Desktop Preview" \
            --notes "Desktop preview builds for macOS, Windows, and Linux. These binaries are built from the Forge source at ${COMMIT_SHA}. The macOS and Windows installers are not signed; review the checksum file and source code before installing. macOS may require a manual Gatekeeper approval. This preview is separate from the stable Android release."
