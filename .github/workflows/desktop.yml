name: Desktop builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v10.6.4)'
        required: true
        default: 'v10.7.3'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Windows for $TAG ($VERSION)"

      - name: Resolve Flutter version
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/^  flutter: \^*\([0-9.]*\)/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Test Windows Runtime initialization
        run: |
          cmake -S test/windows/runtime -B build/windows-runtime-test -A x64
          cmake --build build/windows-runtime-test --config Release
          ctest --test-dir build/windows-runtime-test -C Release --output-on-failure

      - name: Build Windows release
        run: flutter build windows --release

      - name: Test native playback
        shell: bash
        run: |
          export MUSIFY_TEST_LIBMPV="$(pwd)/build/windows/x64/runner/Release/libmpv-2.dll"
          flutter test test/desktop/audio_native_test.dart test/desktop/media_handler_native_test.dart

      - name: Check Windows startup
        run: python .github/scripts/check_desktop_startup.py build/windows/x64/runner/Release/forge.exe

      - name: Check Windows icons
        run: python .github/scripts/check_windows_icons.py build/windows/x64/runner/Release/forge.exe

      - name: Package Windows assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # Create portable ZIP
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Forge-v$version-windows-x64.zip"
          
          # Create Inno Setup installer if available
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Compiling Inno Setup installer..."
            & $iscc "/DMyAppVersion=$version" windows\installer.iss
            if ($LASTEXITCODE -ne 0) {
              Write-Error "ISCC compilation failed with code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          } else {
            Write-Host "ISCC not found; skipping installer build."
          }
          Get-ChildItem dist

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building macOS for $TAG ($VERSION)"

      - name: Resolve Flutter version
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/^  flutter: \^*\([0-9.]*\)/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist dmg_root
          APP_SRC="build/macos/Build/Products/Release/forge.app"
          if [ ! -d "$APP_SRC" ]; then
            APP_SRC="build/macos/Build/Products/Release/Forge.app"
          fi
          test -d "$APP_SRC"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP_SRC" || true
          cp -R "$APP_SRC" dmg_root/Forge.app
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Forge" -srcfolder dmg_root -ov -format UDZO "dist/Forge-v${VERSION}-macos.dmg"
          ls -lh dist

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish desktop release assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: new_assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: new_assets

      - name: Publish assets and update checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          
          echo "Publishing desktop assets for release $TAG"
          ls -lh new_assets
          
          mkdir -p all_assets
          cd all_assets
          
          # Download all existing release assets (Android APKs, etc.)
          gh release download "$TAG" --repo lokesh12dev/Forge --dir . || true
          echo "Existing assets in release:"
          ls -lh
          
          # Copy new desktop assets into all_assets (files only, skip subdirectories)
          find ../new_assets -maxdepth 1 -type f -exec cp {} . \;
          
          # Upload each new desktop asset (files only)
          find ../new_assets -maxdepth 1 -type f | while read -r f; do
            filename=$(basename "$f")
            if [ "$filename" != "SHA256SUMS.txt" ]; then
              echo "Uploading $filename to release $TAG..."
              gh release upload "$TAG" "$filename" --repo lokesh12dev/Forge --clobber
            fi
          done
          
          # Regenerate SHA256SUMS.txt covering all assets
          rm -f SHA256SUMS.txt
          sha256sum Forge-* > SHA256SUMS.txt
          echo "Regenerated SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          
          # Upload updated SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo lokesh12dev/Forge --clobber
          echo "Release assets successfully updated for $TAG"
